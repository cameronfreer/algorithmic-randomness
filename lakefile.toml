name = "algorithmic-randomness"
version = "0.1.0"
license = "Apache-2.0"
keywords = ["math"]
defaultTargets = ["AlgorithmicRandomness", "AlgorithmicRandomnessExperimental"]

# Pinned to the mathlib revision at the v4.32.2 tag, matching the toolchain in
# `lean-toolchain` so everything builds against exactly one mathlib.
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "905b95818eb32af7874a58b427f50c1711a5e96c"

[[lean_lib]]
name = "AlgorithmicRandomness"
# `longFile` and `longFileDefValue` must be set to the same value, or the linter
# nags to remove a `set_option` on every short file (fatal under `warningAsError`).
leanOptions = { autoImplicit = false, weak.linter.mathlibStandardSet = true, weak.linter.style.longFile = 1500, weak.linter.style.longFileDefValue = 1500, warningAsError = true }

# Work in progress and material staged for promotion into the spine. Never imported by
# the `AlgorithmicRandomness` root spine — `scripts/check_sorry_boundary.py` enforces
# that — so `sorry` is permitted here and only here. It is still a default target, so CI
# requires it to typecheck; `warningAsError` is off because `declaration uses 'sorry'`
# is a warning and would otherwise fail the build.
[[lean_lib]]
name = "AlgorithmicRandomnessExperimental"
leanOptions = { autoImplicit = false, weak.linter.mathlibStandardSet = true, weak.linter.style.longFile = 1500, weak.linter.style.longFileDefValue = 1500, warningAsError = false }
