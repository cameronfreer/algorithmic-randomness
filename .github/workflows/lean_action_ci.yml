name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # Builds the `AlgorithmicRandomness` library (strict — `warningAsError` is on).
      - uses: leanprover/lean-action@v1
