name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # Builds both default targets: the `AlgorithmicRandomness` root spine (strict —
      # `warningAsError` is on) and the `AlgorithmicRandomnessExperimental` staging library
      # (sorries permitted, but it must still typecheck).
      - uses: leanprover/lean-action@v1

      # The sorry boundary: the root spine is sorry-free and never imports anything from
      # the staging library. Pure source analysis, so it does not depend on build artefacts.
      - name: Verify the sorry boundary
        run: python3 scripts/check_sorry_boundary.py
